services:
  statedock:
    image: statedock/statedock:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # - STATEDOCK_AGENT_TOKEN=your_secure_agent_token  # Optional: Bearer token for Coding Agents
      # - PUBLIC_BASE_URL=https://dock.example.com       # Optional: Public domain for remote MCP/OAuth
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - statedock

volumes:
  caddy_data:
  caddy_config:
